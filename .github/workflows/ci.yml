name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: honba-data
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pyright
          pip install -e .

      - name: Linting & Formatting Check
        working-directory: honba-data
        run: |
          ruff check .
          ruff format --check .

      - name: Run Tests
        working-directory: honba-data
        run: pytest -q
